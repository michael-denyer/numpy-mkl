name: Rebuild scipy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # See force_numpy.yml: the test step resolves against our index, which must
  # carry the MKL runtime the built wheel pins.
  links:
    uses: ./.github/workflows/links.yml

  scipy:
    uses: ./.github/workflows/wheels.yml
    with:
      name: scipy
      repo: scipy/scipy
      force-build: true
      # version: 1.18.0
    needs: links
