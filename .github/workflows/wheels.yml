name: Wheels

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: "Package to build (numpy, scipy, mkl-service)"
      repo:
        required: true
        type: string
        description: "Source repo (numpy/numpy, scipy/scipy, IntelPython/mkl-service)"
      matrix:
        required: true
        type: string
        description: "Shared package-set build coordinates"
      tag:
        required: true
        type: string
        description: "Upstream source tag selected by the package-set plan"
      version:
        required: true
        type: string
        description: "Upstream version selected by the package-set plan"

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    name: ${{ inputs.name }}-${{ matrix.python_version }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      PACKAGE_NAME: ${{ inputs.name }}
      PACKAGE_VERSION: ${{ inputs.version }}
      PYTHON_TAG: ${{ matrix.python_version }}
      NUMPY_BLAS: ${{ matrix.numpy_blas }}
      NUMPY_ILP64: ${{ matrix.numpy_ilp64 }}
      NUMPY_SYMBOL_SUFFIX: ${{ matrix.numpy_symbol_suffix }}
      SCIPY_BLAS: ${{ matrix.scipy_blas }}
      SCIPY_ILP64: ${{ matrix.scipy_ilp64 }}
      SCIPY_CYTHON_BLAS_ABI: ${{ matrix.scipy_cython_blas_abi }}
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
      fail-fast: false
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out src
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.tag }}
          path: src
          submodules: recursive
          persist-credentials: false

      - name: Prepare environment
        run: |
          # Need this since pyproject.toml doesn't apply to $SRC_DIR.
          echo "UV_PYTHON_PREFERENCE=only-managed" >>$GITHUB_ENV

          # Move src to avoid pyproject conflicts.
          mv src ../../ && echo "SRC_DIR=${GITHUB_WORKSPACE}/../../src" >>$GITHUB_ENV

          # Path to MKL sources, referenced in the final build.
          echo "MKL_VENV=$(realpath "${GITHUB_WORKSPACE}"/../../mkl)" >>$GITHUB_ENV

          # Dedicated environment for the 'build-deps' group. Kept out of the workspace and
          # passed as UV_PROJECT_ENVIRONMENT only to the steps that use the group, so that
          # syncing it can never clobber (or be clobbered by) another venv.
          echo "BUILD_VENV=$(realpath "${GITHUB_WORKSPACE}"/../../build-deps)" >>$GITHUB_ENV

      - name: Prepare environment (Linux)
        if: runner.os != 'Windows'
        run: |
          echo "venv_bin=bin" >>$GITHUB_ENV

      - name: Prepare environment (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "venv_bin=Scripts" >>$GITHUB_ENV

      - name: Set up python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python_version }}
          version-file: "pyproject.toml"
          enable-cache: false

      - name: Install MKL libraries
        run: |
          # Prevent using future MKL versions, which may not be backward compatible.
          RELEASE_YEAR=$(git -C "${{ env.SRC_DIR }}" log -1 --format=%cd --date=format:%Y)
          MKL_SPEC="mkl-devel<$((RELEASE_YEAR + 1)).0.0"
          if [[ "$PACKAGE_NAME" == "numpy" && "$NUMPY_ILP64" == "true" ]] ||
              [[ "$PACKAGE_NAME" == "scipy" && "$SCIPY_ILP64" == "true" ]]; then
            # MKL 2025.2 through 2025.3 omit LAPACK _64_ symbols from the
            # direct ILP64 interface libraries.
            MKL_SPEC="mkl-devel>=2026.0.0,<$((RELEASE_YEAR + 1)).0.0"
          fi

          uv venv "${{ env.MKL_VENV }}"
          source "${{ env.MKL_VENV }}/${{ env.venv_bin }}"/activate
          uv pip install "$MKL_SPEC"


          # Get exact MKL version.
          echo "MKL_VERSION=$(uv pip show mkl | grep '^Version' | sed 's/Version: //')" \
              >>$GITHUB_ENV

          # Get pkg-config path (numpy, scipy).
          echo "PKG_CONFIG_PATH=$(python tools/get_file_in_pkg mkl-sdl.pc \
              --pkg mkl-devel --parent)" >>$GITHUB_ENV

          # Get CMake package path (mkl-service). MKL_DIR is where CMake's find_package looks
          # for MKLConfig.cmake.
          echo "MKL_DIR=$(python tools/get_file_in_pkg MKLConfig.cmake \
              --pkg mkl-devel --parent)" >>$GITHUB_ENV

          # Fetch MKL license.
          cat "$(python tools/get_file_in_pkg LICENSE.txt --pkg mkl-devel)" \
              >>"${GITHUB_WORKSPACE}/patches/LICENSE_MKL.txt"

          # Add .so -> .so.* symlinks to fix linking for mkl-service. mkl wheels
          # ship only versioned filenames (libmkl_rt.so.2 in 2025.x, .so.3 in
          # 2026.x); the linker resolves -lmkl_rt by looking for libmkl_rt.so.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cd "${{ env.MKL_VENV }}"/lib
            for i in libmkl*.so.*; do ln -s $i ${i%.*}; done
          fi

      - name: Apply patches
        run: |
          # Apply patches, if the package has any.
          cd "${{ env.SRC_DIR }}"
          mapfile -t patches < <(
            find "${GITHUB_WORKSPACE}/patches/$PACKAGE_NAME" -maxdepth 1 \
              -name '*.patch' -print
          )
          [[ ${#patches[@]} -eq 0 ]] || git apply "${patches[@]}"

          # Swap in our own import-time hook, which locates MKL through the installed
          # 'mkl' package instead of assuming a Windows venv layout. This relies on
          # _init_helper getting imported, so we assert first that it is.
          if [[ "$PACKAGE_NAME" == "mkl-service" ]]; then
            grep -q '^from \. import _init_helper$' mkl/__init__.py ||
                { echo "::error::mkl-service no longer imports _init_helper"; exit 1; }
            cp "${GITHUB_WORKSPACE}"/patches/mkl-service/_init_helper.py mkl/
            uv run --no-project python \
                "${GITHUB_WORKSPACE}"/tools/test_mkl_init_helper.py
          fi

          # mkl-devel only ships mkl-sdl.pc (Single Dynamic Library config).
          # meson.build requires plain "mkl" for version checking.
          cp "${PKG_CONFIG_PATH}/mkl-sdl.pc" "${PKG_CONFIG_PATH}/mkl.pc"
          ls -la "${PKG_CONFIG_PATH}/mkl.pc"

      - name: Add MKL to runtime dependencies
        working-directory: ${{ env.SRC_DIR }}
        run: |
          # Pin runtime library to the exact version used for compiling.
          MAJOR=$(echo "$MKL_VERSION" | cut -d. -f1)
          if [[ "$PACKAGE_NAME" == "mkl-service" ]]; then
            # Use --frozen (implies --no-sync) to skip re-locking, which would make meson-python
            # configure the whole project just to resolve the dynamic version.
            uv add --frozen "mkl>=${MKL_VERSION},<$((MAJOR + 1)).0.0"
          else
            # mkl-service floor: 2.8.0 is the first version with Windows wheels on our index.
            uv add --no-sync "mkl>=${MKL_VERSION},<$((MAJOR + 1)).0.0" "mkl-service>=2.8.0"
          fi

      - name: Add MKL licence
        working-directory: ${{ env.SRC_DIR }}
        run: |
          echo "" >>LICENSE.txt
          echo "----" >>LICENSE.txt
          echo "" >>LICENSE.txt
          [[ "$PACKAGE_NAME" == "scipy" ]] && cat LICENSES_bundled.txt >>LICENSE.txt
          cat "${GITHUB_WORKSPACE}/patches/LICENSE_MKL.txt" >>LICENSE.txt
        if: inputs.name != 'mkl-service'

      - name: Install Windows build dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.BUILD_VENV }}
        run: |
          if [[ "$PACKAGE_NAME" == "numpy" || "$PACKAGE_NAME" == "scipy" ]]; then
            # Pkg-config is required for numpy and scipy. Use the locked PyPI package;
            # Chocolatey's SourceForge download intermittently times out.
            echo "PKG_CONFIG=$(uv run --locked --only-group build-deps \
                python -c 'import pkgconf; print(pkgconf.get_executable())')" >>$GITHUB_ENV
          fi
          if [[ "$PACKAGE_NAME" == "scipy" ]]; then
            # SciPy requires the MinGW gcc/gfortran and binutils already on the runner.
            gfortran --version || { echo "::error::no gfortran on PATH"; exit 1; }
            strip --version >/dev/null || { echo "::error::no strip on PATH"; exit 1; }
          fi
        if: runner.os == 'Windows'

      - name: Install manylinux build dependencies
        run: |
          case "$PACKAGE_NAME" in
            mkl-service)
              dnf -y install clang
              ;;
            numpy)
              # Tests for distutil require clang (Python < 3.12).
              [[ "$UV_PYTHON" =~ ^(cp310|cp311)$ ]] && dnf -y install clang || true
              ;;
          esac
        if: runner.os == 'Linux'

      - name: Build wheel
        working-directory: ${{ env.SRC_DIR }}
        run: |
          case "$PACKAGE_NAME" in
            numpy)
              # Baseline is the floor the whole library is compiled against, so the wheel refuses
              # to import below it: X86_V3 is x86-64-v3 (AVX2/FMA3/BMI2), i.e. Intel Haswell
              # 2013+. It only buys speed in code numpy cannot runtime-dispatch (~10-18% on
              # np.where, casts, structured assignment). 'max' takes every dispatch level the
              # compiler supports at the cost of some binary size. Note MSVC gets none of them:
              # numpy disables X86_V4 and AVX512_ICL there (broken in Highway), so the Windows
              # wheels are AVX2-only regardless of what we ask for.
              args="-Csetup-args=-Dallow-noblas=false \
                    -Csetup-args=-Dcpu-baseline=X86_V3 \
                    -Csetup-args=-Dcpu-dispatch=max \
                    -Csetup-args=-Dblas=${NUMPY_BLAS} \
                    -Csetup-args=-Dlapack=${NUMPY_BLAS} \
                    -Csetup-args=-Duse-ilp64=${NUMPY_ILP64} \
                    -Csetup-args=-Dblas-symbol-suffix=${NUMPY_SYMBOL_SUFFIX}"
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                args="${args} -Csetup-args=--vsenv"
              fi
              ;;

            scipy)
              args="-Csetup-args=-Dblas=${SCIPY_BLAS} \
                    -Csetup-args=-Dlapack=${SCIPY_BLAS} \
                    -Csetup-args=-Duse-g77-abi=true"
              if [[ "$SCIPY_ILP64" == "true" ]]; then
                # SciPy keeps its public Cython ABI at LP64 while using ILP64 internally.
                args="${args} -Csetup-args=-Duse-ilp64=true \
                      -Csetup-args=-Dcython-blas-abi=${SCIPY_CYTHON_BLAS_ABI}"
              fi
              ;;

            'mkl-service')
              # Built with meson-python; MKL is located through its CMake package
              # config, i.e. via $MKL_DIR.
              args="--no-build-isolation"
              case "${{ runner.os }}" in
                # Force MSVC; meson prefers any gcc on PATH over falling back to VS.
                Windows) args="${args} -Csetup-args=--vsenv" ;;
              esac
              uv venv buildenv && source buildenv/"${{ env.venv_bin }}"/activate
              uv pip install meson-python ninja cmake cython
              ;;
          esac
          uv build --wheel --index "$PAGES_URL" ${args}

      - name: Repair wheel (Linux)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.BUILD_VENV }}
        run: |
          mkdir -p wheelhouse
          plat="$(ldd --version | head -1 | awk '{ print $NF }' | tr '.' '_')_$(uname -m)"
          # Never vendor MKL, ILP64 included: the mkl runtime package ships
          # libmkl_intel_ilp64.so.3 alongside the LP64 one. Vendoring bundles only
          # the link-time libs, while MKL dlopen()s its compute kernels
          # (libmkl_def, libmkl_avx2, libmkl_avx512) at runtime and they would be
          # missing from the wheel.
          uv run --locked --only-group build-deps \
              auditwheel repair "${{ env.SRC_DIR }}"/dist/*.whl -w wheelhouse \
              --exclude 'libmkl*' --plat=manylinux_${plat} --strip
        if: runner.os == 'Linux'

      - name: Show wheel dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          uvx delvewheel show "${{ env.SRC_DIR }}"/dist/*.whl \
              --add-path "${{ env.MKL_VENV }}/Library/bin"

      - name: Strip symbols (Windows)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.BUILD_VENV }}
        run: |
          # MinGW leaves a COFF symbol table in every .pyd, ~40 MB per scipy wheel (~5 MB
          # compressed). Only scipy is built with gcc; the MSVC-built packages keep their
          # debug info in separate .pdb files that never enter the wheel, so they have
          # nothing to strip. Mirrors upstream's tools/wheels/repair_windows.sh, which
          # strips for the additional reason that delvewheel cannot name-mangle a .pyd
          # carrying an overlay -- relevant here only if we ever stop excluding every DLL
          # from vendoring. Run before delvewheel: patched binaries must not be rewritten
          # afterwards. Paths stay absolute so that uv keeps resolving against our own
          # pyproject.toml rather than the one in $SRC_DIR.
          dist="${{ env.SRC_DIR }}/dist"
          uv run --locked --only-group build-deps wheel unpack "$dist"/*.whl -d "$dist/unpacked"
          find "$dist/unpacked" -name '*.pyd' -exec strip {} +

          # 'wheel pack' rewrites RECORD with the post-strip hashes and re-derives the
          # filename from the tags in WHEEL, so it lands back where the original was.
          rm -f "$dist"/*.whl
          uv run --locked --only-group build-deps wheel pack "$dist"/unpacked/* -d "$dist"
        if: runner.os == 'Windows' && inputs.name == 'scipy'

      - name: Repair wheel (Windows)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.BUILD_VENV }}
        run: |
          mkdir -p wheelhouse
          # MKL runtime DLLs are provided by the mkl pip package installed in
          # the test environment. Exclude all of them: copying only one direct
          # interface DLL makes delvewheel load it before mkl-service registers
          # the directory containing the rest of the MKL runtime.
          uv run --locked --only-group build-deps \
              delvewheel repair "${{ env.SRC_DIR }}"/dist/*.whl -w wheelhouse \
              --add-path "${{ env.MKL_VENV }}/Library/bin" \
              --exclude "mkl_*.dll" --exclude libsf_error_state.dll
        if: runner.os == 'Windows'

      - name: Download same-run dependency wheels
        if: inputs.name != 'mkl-service'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mkl-service-${{ matrix.python_version }}-${{ runner.os }}
          path: dependency-wheelhouse/mkl-service

      - name: Download same-run numpy wheels
        if: inputs.name == 'scipy'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: numpy-${{ matrix.python_version }}-${{ runner.os }}
          path: dependency-wheelhouse/numpy

      - name: Run tests
        run: |
          # Make sure we don't pick up the development MKL libraries.
          rm -rf "${{ env.MKL_VENV }}"

          uv venv testenv && source testenv/"${{ env.venv_bin }}"/activate
          mapfile -t built_wheels < <(find wheelhouse -maxdepth 1 -name '*.whl' -print)
          [[ ${#built_wheels[@]} -eq 1 ]] || {
            echo "::error::Expected one newly built $PACKAGE_NAME wheel"
            exit 1
          }
          dependency_wheels=()
          if [[ "$PACKAGE_NAME" != "mkl-service" ]]; then
            mapfile -t mkl_service_wheels < <(
              find dependency-wheelhouse/mkl-service -maxdepth 1 -name '*.whl' -print
            )
            [[ ${#mkl_service_wheels[@]} -eq 1 ]] || {
              echo "::error::Expected one same-run mkl-service wheel"
              exit 1
            }
            dependency_wheels+=("${mkl_service_wheels[0]}")
          fi
          if [[ "$PACKAGE_NAME" == "scipy" ]]; then
            mapfile -t numpy_wheels < <(
              find dependency-wheelhouse/numpy -maxdepth 1 -name '*.whl' -print
            )
            [[ ${#numpy_wheels[@]} -eq 1 ]] || {
              echo "::error::Expected one same-run NumPy wheel"
              exit 1
            }
            dependency_wheels+=("${numpy_wheels[0]}")
          fi
          uv pip install "${dependency_wheels[@]}" "${built_wheels[@]}" \
              --index "$PAGES_URL"

          case "$PACKAGE_NAME" in
            numpy)
              uv pip install -r "${{ env.SRC_DIR }}"/requirements/test_requirements.txt
              uv pip install threadpoolctl
              EXPECT_NUMPY_ILP64="$NUMPY_ILP64" python tools/numpy_tests.py
              ;;

            scipy)
              # Only install essential test dependencies, mirroring official wheel builder.
              # Installing the full set below needs 'dnf -y install libmpc-devel' on py314,
              # as gmpy2 has no pre-built wheels there and falls back to building from source.
              uv pip install pytest pytest-xdist threadpoolctl pooch hypothesis
              EXPECT_SCIPY_ILP64="$SCIPY_ILP64" python tools/scipy_tests.py
              ;;

            mkl-service)
              uv pip install pytest
              pytest -s -v --pyargs mkl
              ;;
          esac

      - name: Store build information
        run: |
          RECIPE_HASH=$(uv run --locked tools/build_recipe.py "$PACKAGE_NAME")
          jq -n \
            --arg name "$PACKAGE_NAME" \
            --arg version "$PACKAGE_VERSION" \
            --arg python "$PYTHON_TAG" \
            --arg os "$RUNNER_OS" \
            --arg mkl "$MKL_VERSION" \
            --arg recipe "$RECIPE_HASH" \
            '{name: $name, version: $version, python: $python, os: $os,
              mkl: $mkl, recipe: $recipe}' \
            >"wheelhouse/versions-${PACKAGE_NAME}-${PYTHON_TAG}-${RUNNER_OS}.json"

      - name: Archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-${{ matrix.python_version }}-${{ runner.os }}
          path: |
            wheelhouse/*.whl
            wheelhouse/*.json
          retention-days: 1

...
