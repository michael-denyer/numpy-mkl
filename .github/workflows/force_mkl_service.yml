name: Rebuild mkl-service

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # See force_numpy.yml: the test step resolves against our index, which must
  # carry the MKL runtime the built wheel pins.
  links:
    uses: ./.github/workflows/links.yml

  mkl-service:
    uses: ./.github/workflows/wheels.yml
    with:
      name: mkl-service
      repo: IntelPython/mkl-service
      force-build: true
      # version: 2.8.0
    needs: links
