name: Rebuild all

on:
  workflow_dispatch:

jobs:
  verify:
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: true
      publish: false

  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: true
      publish: true
