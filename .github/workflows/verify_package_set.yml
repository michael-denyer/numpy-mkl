name: Verify package set

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
        description: "JSON build coordinates produced by the wheel workflow"

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  verify:
    name: package-set-${{ matrix.python_version }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python_version }}
          version-file: "pyproject.toml"
          enable-cache: false

      - name: Download same-run mkl-service wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mkl-service-${{ matrix.python_version }}-${{ runner.os }}
          path: artifacts/mkl-service

      - name: Download same-run NumPy wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: numpy-${{ matrix.python_version }}-${{ runner.os }}
          path: artifacts/numpy

      - name: Download same-run SciPy wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scipy-${{ matrix.python_version }}-${{ runner.os }}
          path: artifacts/scipy

      - name: Install and verify exact same-run wheels
        env:
          EXPECT_NUMPY_ILP64: ${{ matrix.numpy_ilp64 }}
          EXPECT_SCIPY_ILP64: ${{ matrix.scipy_ilp64 }}
          POLICY_RUNNER_OS: ${{ matrix.os }}
        run: |
          shopt -s nullglob
          mkl_service_wheels=(artifacts/mkl-service/*.whl)
          numpy_wheels=(artifacts/numpy/*.whl)
          scipy_wheels=(artifacts/scipy/*.whl)

          [[ ${#mkl_service_wheels[@]} -eq 1 ]] || {
            echo "::error::Expected one mkl-service wheel, found ${#mkl_service_wheels[@]}"
            exit 1
          }
          [[ ${#numpy_wheels[@]} -eq 1 ]] || {
            echo "::error::Expected one NumPy wheel, found ${#numpy_wheels[@]}"
            exit 1
          }
          [[ ${#scipy_wheels[@]} -eq 1 ]] || {
            echo "::error::Expected one SciPy wheel, found ${#scipy_wheels[@]}"
            exit 1
          }

          uv venv verify-env
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source verify-env/Scripts/activate
          else
            source verify-env/bin/activate
          fi
          uv pip install \
            "${mkl_service_wheels[0]}" \
            "${numpy_wheels[0]}" \
            "${scipy_wheels[0]}" \
            --index "$PAGES_URL"
          python tools/verify_package_set.py \
            --mkl-service "${mkl_service_wheels[0]}" \
            --numpy "${numpy_wheels[0]}" \
            --scipy "${scipy_wheels[0]}" \
            --runner-os "$POLICY_RUNNER_OS"
