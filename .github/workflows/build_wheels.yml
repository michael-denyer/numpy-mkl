name: Build wheels

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "15 22 * * 0" # 22.15 UTC every Sunday

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: true
      publish: false

  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: false
      publish: true
