name: Build wheels

on:
  workflow_dispatch:
    inputs:
      numpy-version:
        required: false
        type: string
        default: ""
        description: "Build this NumPy release instead of the ci-targets.yaml target (e.g. 2.4.6)"
  pull_request:
  schedule:
    - cron: "15 22 * * 0" # 22.15 UTC every Sunday

permissions: {}

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    permissions:
      # Reusable-workflow permissions can only stay the same or decrease. The
      # called workflow contains skipped main-only publication jobs that need
      # write access, while every PR job inside it explicitly drops to read.
      contents: write
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: true
      publish: false
      numpy-version: ${{ inputs.numpy-version }}

  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: false
      publish: true
      numpy-version: ${{ inputs.numpy-version }}
