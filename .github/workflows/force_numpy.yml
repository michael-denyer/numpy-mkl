name: Rebuild NumPy matched set

on:
  workflow_dispatch:

# Publishing one package is unsafe: this shortcut forces and verifies the matched set.
jobs:
  verify:
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: true
      publish: false

  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/package_set.yml
    with:
      force-build: true
      publish: true
