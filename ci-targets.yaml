defaults:
  python_versions:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

  runners:
    - runner: ubuntu-latest
      container: quay.io/pypa/manylinux_2_28_x86_64
      os: Linux
      numpy_blas: mkl-dynamic-ilp64-iomp
      numpy_ilp64: true
      numpy_symbol_suffix: _64
      scipy_blas: mkl-dynamic-lp64-seq
      scipy_ilp64: true
      scipy_cython_blas_abi: lp64
    - runner: windows-2022
      container: null
      os: Windows
      numpy_blas: mkl-dynamic-ilp64-seq
      numpy_ilp64: true
      numpy_symbol_suffix: _64
      scipy_blas: mkl-sdl
      scipy_ilp64: false
      scipy_cython_blas_abi: null

  version: latest
  force_build: false

# Overwrites by package. E.g.,
# numpy:
#   python_versions: ["3.13", "3.14"]
